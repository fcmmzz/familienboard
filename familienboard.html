<title>Familienboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
  :root { --t: #E6EDFF; --m: #8C9AC0; --line: rgba(140, 160, 220, .16); }
  html, body { margin: 0; height: 100%; background: #03050c; overflow: hidden; }
  body { font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; color: var(--t); -webkit-font-smoothing: antialiased;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .rj { font-family: Rajdhani, Inter, sans-serif; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .grow { flex: 1; min-width: 0; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--m); }
  .hidden { display: none !important; }
  .tap { cursor: pointer; }
  .tap:active { opacity: .7; }

  #stage { position: absolute; left: 0; top: 0; width: 1180px; height: 820px; transform-origin: 0 0; overflow: hidden; }
  #stage.hoch { width: 820px; height: 1180px; }
  #sky { position: absolute; left: 0; top: 0; }
  #grid { position: absolute; inset: 0; box-sizing: border-box; padding: 16px; display: grid; gap: 12px;
          grid-template-columns: 318px 1fr 1fr; grid-template-rows: 188px 70px 1fr 1fr;
          grid-template-areas: "clock wx wk" "sched tiles tiles" "sched meals tv" "sched notes food"; }
  #stage.hoch #grid { grid-template-columns: 1fr 1fr; grid-template-rows: 150px 188px 70px 1fr 1fr 1fr;
          grid-template-areas: "clock clock" "wx wk" "tiles tiles" "sched meals" "sched tv" "notes food"; }
  #stage.advent #grid { padding-top: 36px; }

  /* Neon-Karten */
  .card { --a: 56, 189, 248; position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
          background: linear-gradient(180deg, rgba(14, 22, 50, .86), rgba(6, 10, 26, .9));
          border: 1.5px solid rgba(var(--a), .55); box-shadow: 0 0 16px rgba(var(--a), .22), inset 0 0 22px rgba(var(--a), .06);
          -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .hd { display: flex; align-items: center; gap: 8px; padding: 7px 12px 6px; font: 700 16px Rajdhani, Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase;
        background: linear-gradient(90deg, rgba(var(--a), .24), rgba(var(--a), .03)); border-bottom: 1px solid rgba(var(--a), .25); color: #fff; flex: none; }

    '<label>Sorte</label><div class="seg" id="sSorte">' + Object.keys(SORTEN).map(function (k) {
      return '<button data-s="' + k + '" class="' + (k === s ? 'on' : '') + '">' + SORTEN[k] + '</button>'; }).join('') + '</div>' +
    '<div class="tog"><input type="checkbox" id="sDemo"' + (SET.demo !== false ? ' checked' : '') + '><span>Beispieldaten zeigen, solange nichts verbunden ist</span></div>' +
    '<div class="btns"><button class="main" id="sOk">Speichern</button><button id="sNo">Schließen</button><button id="sNight" style="margin-left: auto">Nachtansicht testen</button></div>' +
    '<p id="sMsg" class="hint" style="color: #FBBF24"></p>' +
    '<p class="hint">Familienboard 2.1 · TV: TVmaze · Wetter und Ortssuche: Open-Meteo · Sprit: Tankerkönig · Feiertage: Bayern</p>',
  function () {
    var pick = s;
    Array.prototype.forEach.call(document.querySelectorAll('#sSorte button'), function (b) {
      b.onclick = function () { pick = b.getAttribute('data-s'); Array.prototype.forEach.call(document.querySelectorAll('#sSorte button'), function (x) { x.className = x === b ? 'on' : ''; }); };
    });
    $('sNo').onclick = closeDlg;
    $('sNight').onclick = function () { S.nightUntil = Date.now() + 15000; closeDlg(); setTimeout(render, 15100); };
    $('sOk').onclick = function () {
      var v = { daten: $('sDat').value.trim(), kalender: $('sCal').value.trim(), tkKey: $('sTk').value.trim(), sorte: pick, demo: $('sDemo').checked, geburt: $('sGeb').value || '',
                namen: { p1: $('sP1').value.trim(), p2: $('sP2').value.trim(), kind: $('sKind').value.trim() } };
      var q = $('sOrt').value.trim(), btn = $('sOk');
      function save(newOrt) {
        var neu = v.daten && v.daten !== SET.daten;
        Object.keys(v).forEach(function (k) { SET[k] = v[k]; });
        if (newOrt !== undefined) { if (newOrt) SET.ort = newOrt; else delete SET.ort; }
        store.set('settings', SET); S.fuel = null; S.fuelAt = 0; S.calErr = ''; S.syncErr = ''; S.syncAt = 0;
        if (neu) syncSeed();
        closeDlg(); loadCalendar(); loadFuel(); loadWeather(); syncNow();
      }
      if (!q) return save(null);
      if (o && (o.q === q || o.name === q)) return save();
      btn.disabled = true; $('sMsg').textContent = 'Suche ' + q + ' …';
      geocode(q).then(function (r) {
        btn.disabled = false;
        if (r) save(r); else $('sMsg').textContent = '„' + q + '“ nicht gefunden. Anders schreiben oder die PLZ eintragen.';
      }, function () { btn.disabled = false; $('sMsg').textContent = 'Keine Verbindung – der Ort konnte nicht gesucht werden.'; });
    };
  });
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t || t.closest('#dlg')) return;
  var a = t.getAttribute('data-act');
  if (a === 'note-add') addNote();
  else if (a === 'note') {
    toggleNote(t.getAttribute('data-id')); render();
  }
  else if (a === 'notes-all') notesDialog();
  else if (a === 'food-add') foodDialog();
  else if (a === 'week-paste') weekDialog();
  else if (a === 'tv') tvDialog();
  else if (a === 'food') foodItemDialog(t.getAttribute('data-id'));
  else if (a === 'food-all') foodAllDialog();
  else if (a === 'fuel') fuelDialog();
  else if (a === 'vorsorge') vorsorgeDialog(t.getAttribute('data-u'));
  else if (a === 'check') { var cd = store.get('checkDone', {}); cd[t.getAttribute('data-key')] = true; store.set('checkDone', cd); render(); }
  else if (a === 'notes-clear') { doOp({ op: 'clear' }); render(); }
  else if (a === 'dinner') editDinner(t.getAttribute('data-key'));
  else if (a === 'muell-done') { var md = store.get('muellDone', {}); md[t.getAttribute('data-key')] = true; store.set('muellDone', md); render(); }
  else if (a === 'settings') settingsDialog();
  else if (a === 'peek') { S.peekUntil = Date.now() + 45000; S.nightUntil = 0; render(); setTimeout(render, 45500); }
});

/* ----------------------------------------------------------------- Beispieldaten */
function demoCalendar() {
  var t = parts(Date.now()).key, ev = [];
  function add(day, h, mi, dur, who, title) {
    var k = addDays(t, day);
    if (h == null) ev.push({ who: who, title: title, start: localMs(k, 0, 0), end: localMs(addDays(k, 1), 0, 0), allDay: true });
    else { var s = localMs(k, h, mi); ev.push({ who: who, title: title, start: s, end: s + dur * 60000, allDay: false }); }
  }
  add(0, 19, 30, 120, 'p1', 'Sport'); add(0, 9, 0, 60, 'kind', 'Krabbelgruppe');
  add(1, 16, 0, 60, 'p2', 'Friseur'); add(1, 18, 30, 90, 'p1', 'Training');
  add(2, 15, 0, 150, 'familie', 'Oma & Opa zum Kaffee'); add(3, 10, 0, 90, 'kind', 'Kinderturnen');
  add(4, null, 0, 0, 'p2', 'Urlaubstag'); add(4, 18, 30, 90, 'p1', 'Training');
  add(5, 20, 0, 90, 'p2', 'Elternabend'); add(6, 19, 30, 120, 'p1', 'Sport');
  return ev;
}
function demoDinners() {
  var t = parts(Date.now()).key, list = ['Kürbissuppe mit Brot', 'Hähnchen-Gemüse-Pfanne', 'Spätzle mit Linsen', 'Ofengemüse mit Feta', 'Spaghetti Bolognese', 'Kartoffelpuffer mit Apfelmus', 'Gemüse-Risotto'], o = {};
  for (var i = 0; i < 7; i++) o[addDays(t, i)] = list[i];
  return o;
}
function demoFuel() {
  return [{ name: 'Freie Tankstelle', place: ort().name || 'Ortsmitte', dist: 0.9, price: 1.629 }, { name: 'Markentankstelle', place: 'Nachbarort', dist: 5.6, price: 1.649 }, { name: 'Autohof', place: 'an der Autobahn', dist: 6.3, price: 1.669 }];
}
function demoWeather() {
  var p = parts(Date.now()), hourly = [];
  for (var d = 0; d < 3; d++) for (var h = 0; h < 24; h++) {
    var k = addDays(p.key, d), base = 2 + 4 * Math.sin((h - 9) / 24 * 2 * Math.PI) - d;
    var code = h >= 13 && h <= 17 && d === 0 ? 2 : (h > 17 || h < 7 ? 1 : 3);
    hourly.push({ t: k + 'T' + pad(h) + ':00', temp: base, feels: base - 3, pop: d === 1 && h > 12 ? 65 : 10, code: d === 1 && h > 12 ? 61 : code, isDay: h >= 8 && h < 17 });
  }
  var codes = [3, 61, 2, 71, 1, 3, 2], daily = codes.map(function (c, i) { return { key: addDays(p.key, i), code: c, max: [6, 5, 3, 1, 2, 4, 5][i], min: [-2, 1, -1, -3, -4, -1, 0][i], pop: c > 50 ? 70 : 10 }; });
  return { temp: 4, code: 3, isDay: p.h >= 8 && p.h < 17, max: 6, min: -2, sunrise: p.key + 'T07:31', sunset: p.key + 'T16:24', hourly: hourly, daily: daily };
}

function tvDialog() {
  var t = parts(Date.now()).key, list = S.tv || [];
  function grp(day, label) {
    var l = list.filter(function (x) { return x.day === day; });
    if (!l.length) return '';
    return '<p style="margin: 14px 0 2px"><b>' + label + '</b></p>' + l.map(function (x) {
      var ep = (x.s ? 'St. ' + x.s : '') + (x.e ? (x.s ? ' · ' : '') + 'F. ' + x.e : '') + (x.title && !/^(folge|episode|teil)\s*\d+$/i.test(x.title) ? ' · ' + x.title : '');
      var when = x.web ? (x.time ? 'ab ' + x.time : 'neu') : (x.time || '') + (x.net ? ' · ' + x.net : '');
      return '<div class="fl"><span class="pf" style="background: rgba(' + (PF[x.pf] || '148, 163, 184') + ', .5)">' + esc(x.pf) + '</span>' +
        '<span style="flex: 1">' + esc(x.show) + '<br><span style="font-size: 13px; color: #8C9AC0">' + esc(ep) + '</span></span><span style="font-size: 14px">' + esc(when) + '</span></div>';
    }).join('');
  }
  openDlg('<h3>Reality-TV</h3><p>Neue Folgen bei RTL+ und Joyn sowie den Sendern dahinter (bei TVmaze als „Reality“ geführt).' + (S.tvDemo ? ' Gerade Beispieldaten.' : '') + '</p>' +
    (grp(t, 'Heute') + grp(addDays(t, 1), 'Morgen') || '<p>Heute und morgen nichts Neues.</p>') +
    '<p class="hint">Lieblingsshows immer zeigen oder Shows ausblenden: in der Datei unter CONFIG → REALITY. Daten: TVmaze (CC BY-SA)' + (S.tvAt ? ' · Stand ' + hm(S.tvAt) : '') + '</p>' +
    '<div class="btns"><button class="main" id="tX">Schließen</button></div>', function () { $('tX').onclick = closeDlg; });
}

/* ----------------------------------------------------------------- Start */
function fit() {
  var W = window.innerWidth, H = window.innerHeight, hoch = H > W * 1.05, st = $('stage');
  // Breite fest, Höhe passend zum Bildschirm (iPad mini bis iPad Pro füllen so den ganzen Bildschirm)
  STAGE_W = hoch ? 820 : 1180;
  STAGE_H = Math.round(Math.max(hoch ? 1080 : 740, Math.min(hoch ? 1300 : 900, STAGE_W * H / W)));
  st.classList.toggle('hoch', hoch);
  st.style.width = STAGE_W + 'px'; st.style.height = STAGE_H + 'px';
  var s = Math.min(W / STAGE_W, H / STAGE_H);
  st.style.transform = 'scale(' + s + ')';
  st.style.left = Math.round((W - STAGE_W * s) / 2) + 'px';
  st.style.top = Math.round((H - STAGE_H * s) / 2) + 'px';
  drawSky();
  render();
}
var wl = null;
function wake() {   // Bildschirm anlassen (zusätzlich Auto-Sperre auf "Nie" stellen)
  try {
    if (!wl && navigator.wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }).catch(function () {});
    }
  } catch (e) {}
}
VIEW.gear = '0 0 24 24';
MYICONS.gear = '<path fill="currentColor" fill-rule="evenodd" d="' + gearPath() + '"/>';
$('gear').innerHTML = svg('gear', '#9FB4E8', 22);
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
document.addEventListener('visibilitychange', function () { wake(); if (document.visibilityState === 'visible') { loadCalendar(); loadWeather(); loadTV(); syncNow(); } });
document.addEventListener('touchend', wake, { passive: true });
window.addEventListener('online', function () { loadWeather(); loadCalendar(); loadFuel(); loadTV(); syncNow(); });   // WLAN wieder da
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});   // hält eine Kopie des Boards, falls beim Start kein Netz da ist
}
cleanup(); restoreCache(); fit(); wake();
loadWeather(); loadCalendar(); loadFuel(); loadTV(); syncNow();
setInterval(function () { if (!isNight(parts(Date.now()).min)) syncNow(); }, 60000);
setInterval(renderClock, 1000);
setInterval(render, 15000);
setInterval(loadCalendar, 5 * 60000);
setInterval(loadWeather, 15 * 60000);
setInterval(loadFuel, 15 * 60000);
setInterval(loadTV, 60 * 60000);
// einmal am Tag neu laden (frischer Speicher, neue Version) – ab 4 Uhr, aber erst, wenn das Netz da ist.
// Ohne WLAN würde Safari sonst eine Fehlerseite zeigen und das Board stünde still.
var LOADED_ON = parts(Date.now()).key, reloadTry = false;
setInterval(function () {
  var p = parts(Date.now());
  if (p.key === LOADED_ON || p.h < 4 || reloadTry || $('dlg').className !== 'hidden' || navigator.onLine === false) return;
  reloadTry = true;
  fetch(location.href.split('#')[0], { method: 'HEAD', cache: 'no-store' })
    .then(function (r) { if (r.ok) location.reload(); else reloadTry = false; }, function () { reloadTry = false; });
}, 60000);
</script>
